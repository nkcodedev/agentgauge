services:
  postgres:
    image: postgres:16-alpine
    container_name: agentgauge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentgauge
      POSTGRES_PASSWORD: agentgauge
      POSTGRES_DB: agentgauge
    volumes:
      - agentgauge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgauge -d agentgauge"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  agentgauge_pgdata:
